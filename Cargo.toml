[workspace]
resolver = "3"
members = ["haze", "haze-macros", "haze-examples"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/andrei-cosmin/haze-rs"

[workspace.dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.10", default-features = false }
dioxus-fullstack = "0.7.10"
tokio = { version = "1.53", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
format_push_string = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
format_collect = "warn"
assigning_clones = "warn"
needless_pass_by_value = "warn"
unnecessary_to_owned = "warn"
redundant_allocation = "warn"
