[workspace]
resolver = "3"
members = ["haze", "haze-macros", "haze-examples"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andrei-cosmin/haze-rs"

[workspace.dependencies]
anyhow = "1.0.98"
dioxus = { version = "0.7.10", default-features = false }
dioxus-fullstack = "0.7.10"
tokio = { version = "1.53", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
